# test 프로필 — H2 인메모리 (PostgreSQL 모드, dev와 같은 플래그). DB_CLOSE_DELAY=-1: 컨텍스트가 사는 동안 유지.
spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
logging:
  level:
    world.theworld: warn
# llm·trip: 실제 Ollama·검색·Nominatim은 부르지 않는다(BACKEND-CONTRACT §0 "LLM은 테스트하지 않는다"). 닫힌 포트(연결 거부 → 502)·빈 키(503).
# api-key를 여기서 비워 두어 개발 셸의 OLLAMA_API_KEY가 테스트로 새지 않게 한다.
theworld:
  ollama:
    url: http://127.0.0.1:9
  search:
    api-key: ""
  nominatim:
    url: http://127.0.0.1:9
    min-gap-ms: 0
